services:
  - type: web
    name: labelhub-demo-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    dockerCommand: ./scripts/start_render.sh
    envVars:
      - key: LABELHUB_ENVIRONMENT
        value: render
      - key: LABELHUB_DATABASE_URL
        fromDatabase:
          name: labelhub-demo-db
          property: connectionString
      - key: LABELHUB_REDIS_URL
        fromService:
          type: keyvalue
          name: labelhub-demo-redis
          property: connectionString
      - key: LABELHUB_CORS_ORIGINS
        value: '["https://labelhub-demo-frontend.onrender.com"]'
      - key: LABELHUB_JWT_SECRET_KEY
        generateValue: true
      - key: LABELHUB_LLM_PROVIDER
        value: deepseek
      - key: LABELHUB_LLM_MODEL
        value: deepseek-chat
      - key: LABELHUB_LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LABELHUB_LLM_API_KEY
        value: ""
      - key: LABELHUB_LLM_TEMPERATURE
        value: "0"
      - key: LABELHUB_EXPORT_STORAGE_PATH
        value: storage/exports
      - key: LABELHUB_UPLOAD_STORAGE_PATH
        value: storage/uploads

  - type: web
    name: labelhub-demo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://labelhub-demo-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: labelhub-demo-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: labelhub-demo-db
    databaseName: labelhub
    user: labelhub
    plan: free
    ipAllowList: []
