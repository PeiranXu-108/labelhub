services:
  api:
    build:
      context: ./backend
    environment:
      LABELHUB_ENVIRONMENT: docker
      LABELHUB_DATABASE_URL: postgresql+psycopg://labelhub:labelhub@postgres:5432/labelhub
      LABELHUB_REDIS_URL: redis://redis:6379/0
      LABELHUB_JWT_SECRET_KEY: docker-dev-secret
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labelhub
      POSTGRES_USER: labelhub
      POSTGRES_PASSWORD: labelhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
