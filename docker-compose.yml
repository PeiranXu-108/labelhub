services:
  api:
    build:
      context: ./backend
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      LABELHUB_ENVIRONMENT: docker
      LABELHUB_DATABASE_URL: postgresql+psycopg://labelhub:labelhub@postgres:5432/labelhub
      LABELHUB_REDIS_URL: redis://redis:6379/0
      LABELHUB_JWT_SECRET_KEY: docker-dev-secret
      LABELHUB_LLM_PROVIDER: ${LABELHUB_LLM_PROVIDER:-deepseek}
      LABELHUB_LLM_MODEL: ${LABELHUB_LLM_MODEL:-deepseek-chat}
      LABELHUB_LLM_BASE_URL: ${LABELHUB_LLM_BASE_URL:-https://api.deepseek.com}
      LABELHUB_LLM_API_KEY: ${LABELHUB_LLM_API_KEY:-}
      LABELHUB_LLM_TEMPERATURE: ${LABELHUB_LLM_TEMPERATURE:-0}
      LABELHUB_EXPORT_STORAGE_PATH: ${LABELHUB_EXPORT_STORAGE_PATH:-storage/exports}
      LABELHUB_UPLOAD_STORAGE_PATH: ${LABELHUB_UPLOAD_STORAGE_PATH:-storage/uploads}
    ports:
      - "8000:8000"
    volumes:
      - export-storage:/app/storage/exports
      - upload-storage:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      LABELHUB_ENVIRONMENT: docker
      LABELHUB_DATABASE_URL: postgresql+psycopg://labelhub:labelhub@postgres:5432/labelhub
      LABELHUB_REDIS_URL: redis://redis:6379/0
      LABELHUB_JWT_SECRET_KEY: docker-dev-secret
      LABELHUB_LLM_PROVIDER: ${LABELHUB_LLM_PROVIDER:-deepseek}
      LABELHUB_LLM_MODEL: ${LABELHUB_LLM_MODEL:-deepseek-chat}
      LABELHUB_LLM_BASE_URL: ${LABELHUB_LLM_BASE_URL:-https://api.deepseek.com}
      LABELHUB_LLM_API_KEY: ${LABELHUB_LLM_API_KEY:-}
      LABELHUB_LLM_TEMPERATURE: ${LABELHUB_LLM_TEMPERATURE:-0}
      LABELHUB_EXPORT_STORAGE_PATH: ${LABELHUB_EXPORT_STORAGE_PATH:-storage/exports}
      LABELHUB_UPLOAD_STORAGE_PATH: ${LABELHUB_UPLOAD_STORAGE_PATH:-storage/uploads}
    volumes:
      - export-storage:/app/storage/exports
      - upload-storage:/app/storage/uploads
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labelhub
      POSTGRES_USER: labelhub
      POSTGRES_PASSWORD: labelhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelhub -d labelhub"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  export-storage:
  upload-storage:
